name: Popup or redirect report
description: Report a missed redirect, incorrect block, or compatibility problem using public, reproducible information.
title: "[Redirect report]: "
labels: ["needs-reproduction"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PopIntent. Do not include private URLs, browsing history, account details, personal screenshots, or diagnostic files you have not reviewed.
  - type: dropdown
    id: outcome
    attributes:
      label: What happened?
      options:
        - An unwanted popup or redirect was missed
        - A legitimate action was blocked
        - Open anyway did not recover the destination
        - Another compatibility problem
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Microsoft Edge
        - Google Chrome
        - Another Chromium browser
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: e.g. 151.0.1234.56
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: PopIntent mode
      options:
        - Default
        - Strict
        - Paused
    validations:
      required: true
  - type: input
    id: reproduction
    attributes:
      label: Public reproduction URL or minimal fixture
      description: Use a public test page or link to minimal HTML. Do not submit a private or authenticated URL.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Tell us exactly what you clicked and what happened next.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private URLs, browsing history, account details, and personal information.
          required: true
        - label: I can reproduce this on the public URL or minimal fixture above.
          required: true
